seed: 12345
device: auto
output_dir: outputs/ztautau

physics:
  nominal_C: 0.60
  true_C_values: [0.20, 0.40, 0.60, 0.80, 0.90]
  m_Z: 91.1876
  m_tau: 1.77686
  visible_beta_alpha: 2.0
  visible_beta_beta: 2.0
  axis_singularity_tolerance: 1.0e-6
  validity_tolerance: 1.0e-8

detector:
  relative_energy_resolution: 0.03
  angular_resolution: 0.015

data:
  nominal_events: 300000
  train_fraction: 0.50
  score_fraction: 0.20
  pseudo_experiments: 300
  events_per_pseudo_experiment: 20000

flow:
  context_dim: 8
  hidden_width: 96
  coupling_layers: 6
  scale_limit: 1.5

training:
  batch_size: 4096
  baseline_epochs: 40
  score_epochs: 30
  learning_rate: 0.001
  weight_decay: 1.0e-5
  grad_clip_norm: 5.0
  score_hidden_width: 64
  score_hidden_layers: 3

fisher_validation:
  reco_bins: 40
  pseudo_experiments: 200
  events_per_pseudo_experiment: 20000
  relative_tolerance: 0.30

dgpo:
  epochs: 30
  group_size: 8
  learning_rate: 0.0002
  weight_decay: 1.0e-5
  reward_scale: 100000.0
  trust_kl_coefficient: 0.10
  no_trust_kl_coefficient: 0.0
  monitor_events: 20000

inference:
  reco_bins: 30
  scan_range: [-0.95, 0.95]
  scan_points: 381

diagnosis:
  nominal_events: 300000
  score_train_fraction: 0.50
  score_epochs: 50
  score_fisher_relative_tolerance: 0.30
  stale_fisher_gain_gap_threshold: 0.10
  kl_concentration_ratio_threshold: 3.0
  score_balance_z_threshold: 2.0
  fisher_reco_bins: [20, 30, 40, 60, 80]
  truth_x_bins: 20
  score_magnitude_bins: 12
  score_grid_points: 400

policies:
  baseline: true
  fisher_dgpo_no_trust: true
  fisher_dgpo_trust: true
  fisher_dgpo_trust_bias_control: false

plots:
  dpi: 160
  diagnostic_events: 50000
  candidate_display_events: 3
  response_bins: 30
  reweight_validation_bins: 15
