seed: 12345
device: cpu
output_dir: /tmp/toy_dgpo_ztautau_smoke

physics:
  nominal_C: 0.60
  true_C_values: [0.20, 0.40, 0.60, 0.80, 0.90]
  m_Z: 91.1876
  m_tau: 1.77686
  visible_beta_alpha: 2.0
  visible_beta_beta: 2.0
  axis_singularity_tolerance: 1.0e-6
  validity_tolerance: 1.0e-8

detector:
  relative_energy_resolution: 0.03
  angular_resolution: 0.015

data:
  nominal_events: 6000
  train_fraction: 0.50
  score_fraction: 0.20
  pseudo_experiments: 3
  events_per_pseudo_experiment: 500

flow:
  context_dim: 8
  hidden_width: 32
  coupling_layers: 4
  scale_limit: 1.5

training:
  batch_size: 512
  baseline_epochs: 20
  score_epochs: 10
  learning_rate: 0.001
  weight_decay: 1.0e-5
  grad_clip_norm: 5.0
  score_hidden_width: 32
  score_hidden_layers: 2

fisher_validation:
  reco_bins: 12
  pseudo_experiments: 5
  events_per_pseudo_experiment: 500
  relative_tolerance: 20.0

dgpo:
  epochs: 2
  group_size: 8
  learning_rate: 0.0002
  weight_decay: 1.0e-5
  reward_scale: 10000.0
  trust_kl_coefficient: 0.10
  no_trust_kl_coefficient: 0.0
  monitor_events: 1000

refresh:
  rounds: 2
  dgpo_epochs_per_round: 1
  score_events: 3000
  fisher_events: 4000
  score_epochs: 3
  score_grid_points: 100
  direct_fisher_bins: 30
  beta_local: 0.10
  beta_global: 0.0
  output_subdir: refresh_study

inference:
  reco_bins: 12
  scan_range: [-0.95, 0.95]
  scan_points: 101
  calibration_events: 30000
  calibration_chunk_size: 5000

diagnosis:
  nominal_events: 20000
  score_train_fraction: 0.50
  score_epochs: 50
  score_fisher_relative_tolerance: 0.30
  stale_fisher_gain_gap_threshold: 0.10
  kl_concentration_ratio_threshold: 3.0
  fisher_reco_bins: [20, 30, 40, 60, 80]
  truth_x_bins: 12
  score_magnitude_bins: 8
  score_grid_points: 200

closure:
  events: 50000
  chunk_size: 10000
  score_per_event_tolerance: 3.0e-3
  yield_relative_tolerance: 0.05
  shape_total_variation_tolerance: 0.08
  asimov_bias_tolerance: 0.20
  asimov_sigma_tolerance: 3.0

policies:
  baseline: true
  fisher_dgpo_no_trust: false
  fisher_dgpo_trust: true
  iterative_refresh_trust: true
  iterative_refresh_no_trust: false
  fisher_dgpo_trust_bias_control: false

plots:
  dpi: 80
  diagnostic_events: 10000
  candidate_display_events: 3
  response_bins: 12
  reweight_validation_bins: 15
