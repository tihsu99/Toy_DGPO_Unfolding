base_config: smoke.yaml
cnn_output_dir: /private/tmp/toy_dgpo_consolidation_smoke
cdiag_output_dir: /private/tmp/toy_dgpo_spin_matrix_smoke
cdiag_checkpoint_name: iterative_refresh_multi_no_trust
require_cdiag_checkpoint: true
output_dir: /private/tmp/toy_dgpo_spin_bc5_smoke

study:
  score_events: 4000
  evaluation_events: 6000
  score_epochs: 4
  score_hidden_width: 32
  score_hidden_layers: 2
  batch_size: 512
  condition_number_max: 1.0e10
  eigenvalue_relative_tolerance: 1.0e-10
  null_pseudo_experiments: 3
  null_events_per_experiment: 500
  response_bins: 12

multi_training:
  enabled_targets: [BC5]
  primary_target: BC5
  target_sets:
    Cdiag: [C_nn, C_rr, C_kk]
    BC5: [C_nn, C_rr, C_kk, B_plus_n, B_minus_n]
  refresh_modes: [fixed, adaptive]
  primary_refresh_mode: adaptive
  fixed_refresh_epochs: 1
  min_epochs_between_refresh: 1
  max_epochs_between_refresh: 2
  nmse_ratio_warning: 1.10
  fisher_closure_log_threshold: 0.05
  direct_validation_interval_epochs: 1
  max_dgpo_epochs: 2
  max_refresh_rounds: 2
  dgpo_epochs_per_round: 1
  score_events: 4000
  training_events: 4000
  validation_events: 6000
  monitor_events: 3000
  direct_validation_events: 6000
  direct_fisher_bins_per_dimension: 2
  score_epochs: 4
  score_hidden_width: 32
  score_hidden_layers: 2
  batch_size: 512
  group_size: 4
  learning_rate: 0.0002
  weight_decay: 1.0e-5
  grad_clip_norm: 5.0
  reward_scale: 10000.0
  lambda_num: 1.0e-10
  condition_number_max: 1.0e10
  eigenvalue_relative_tolerance: 1.0e-10
  early_stop_patience_rounds: 2
  early_stop_patience_checks: 10
  min_relative_objective_improvement: 0.002
  compute_d_optimal_diagnostic: true
  score_warm_start: true
  warm_start_check_interval: 3
  warm_start_mse_log_tolerance: 0.10
  warm_start_closure_log_tolerance: 0.05
  warm_start_curve_rms_tolerance: 0.10
  score_curve_bins: 8
  allow_overwrite: false

seed_offsets:
  passive_score: 800000
  passive_evaluation: 810000
  null_experiments: 820000
  null_reconstruction: 830000
  multi_score: 900000
  multi_training: 910000
  multi_validation: 920000
  multi_reconstruction: 930000
  multi_monitor: 940000
  multi_direct_validation: 950000
  multi_monitor_reconstruction: 960000
  multi_direct_reconstruction: 970000

plots:
  dpi: 80
